# GitHub Actions workflow. Canonical copy; .github/workflows/ci.yml must stay identical
# (tests/architecture/test_repo_structure.py enforces it).
# Runs fully offline: LLM_PROVIDER=fake, EMBEDDING_PROVIDER=fake, no secrets required.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLM_PROVIDER: fake
  EMBEDDING_PROVIDER: fake
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/*/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          for f in services/*/requirements.txt; do pip install -r "$f"; done
          pip install -r requirements-dev.txt
      - name: Lint
        run: python scripts/dev.py lint
      - name: Type check (mypy --strict on libs + domain + application)
        run: python scripts/dev.py typecheck
      - name: Tests (unit, contract, architecture; coverage gate on domain/application)
        run: python scripts/dev.py test
      - name: Evaluation gate (retrieval hit-rate@5 / MRR / off-topic; golden set added in Phase 6)
        run: python scripts/dev.py eval

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [api_gateway, ingestion, retrieval, advisor, evaluation]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  e2e:
    runs-on: ubuntu-latest
    needs: [quality, docker-build]
    timeout-minutes: 25
    env:
      GATEWAY_API_KEY: ci-gateway-key-0123456789
      ADMIN_API_KEY: ci-admin-key-0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt -r libs/common/requirements.txt
      # Containers run as uid 10001; on Linux the bind-mounted output dir must be writable for them.
      - run: chmod a+rwX data/processed
      - run: docker compose up -d --build --wait
      - run: sh scripts/ingest_all.sh
      - name: End-to-end tests
        run: python scripts/dev.py test e2e
        env:
          PYTEST_ADDOPTS: --junitxml=e2e-junit.xml
      - name: Annotate failed tests (readable on the run page without the full log)
        if: failure()
        run: python scripts/ci_annotate.py e2e-junit.xml
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
