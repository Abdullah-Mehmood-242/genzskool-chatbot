# Genz Skool Career Advisor: Qdrant + 5 services.
# Works with NO real keys: LLM_PROVIDER and EMBEDDING_PROVIDER default to "fake".
# Values come from .env (compose reads it automatically for ${...} interpolation).
#
#   make up        # build + start, waits for health checks
#   (auto)         # ingestion indexes data/pdfs on startup and re-indexes on changes
#   make ingest    # trigger an ingest explicitly (prints a report)
#   curl -H "X-API-Key: $GATEWAY_API_KEY" -X POST localhost:8000/api/chat \
#        -H "Content-Type: application/json" -d '{"session_id":"demo","message":"How do I enroll?"}'

name: genz-career-advisor

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  APP_ENV: ${APP_ENV:-dev}
  CONFIG_DIR: /app/config

x-embedding-env: &embedding-env
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
  VECTOR_STORE: ${VECTOR_STORE:-qdrant}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-genzskool_kb}
  PROCESSED_DIR: /app/data/processed

services:
  qdrant:
    <<: *service-defaults
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.20.0}
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  ingestion:
    <<: *service-defaults
    build: { context: ., dockerfile: services/ingestion/Dockerfile }
    environment:
      <<: [*common-env, *embedding-env]
      PDF_DIR: /app/data/pdfs
      # Auto-ingest (ADR-0011): index on startup, then watch data/pdfs for new/changed/deleted PDFs.
      AUTO_INGEST_ON_STARTUP: ${AUTO_INGEST_ON_STARTUP:-true}
      AUTO_INGEST_INTERVAL_S: ${AUTO_INGEST_INTERVAL_S:-15}
      AUTO_INGEST_PRUNE: ${AUTO_INGEST_PRUNE:-true}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-64}
      EMBED_RETRY_ATTEMPTS: ${EMBED_RETRY_ATTEMPTS:-3}
    volumes:
      - ./data/pdfs:/app/data/pdfs:ro
      - ./data/processed:/app/data/processed
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      qdrant: { condition: service_healthy }

  retrieval:
    <<: *service-defaults
    build: { context: ., dockerfile: services/retrieval/Dockerfile }
    environment:
      <<: [*common-env, *embedding-env]
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-none}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
    volumes:
      - ./data/processed:/app/data/processed:ro
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      qdrant: { condition: service_healthy }

  advisor:
    <<: *service-defaults
    build: { context: ., dockerfile: services/advisor/Dockerfile }
    environment:
      <<: *common-env
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-800}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      RETRIEVAL_URL: http://retrieval:8002
      SESSION_STORE: ${SESSION_STORE:-memory}
      REDIS_URL: ${REDIS_URL:-}
      PROMPTS_DIR: /app/prompts
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      retrieval: { condition: service_healthy }

  api_gateway:
    <<: *service-defaults
    build: { context: ., dockerfile: services/api_gateway/Dockerfile }
    environment:
      <<: *common-env
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ADVISOR_URL: http://advisor:8003
      INGESTION_URL: http://ingestion:8001
    ports:
      - "8000:8000"
    depends_on:
      advisor: { condition: service_healthy }
      ingestion: { condition: service_healthy }

  evaluation:
    <<: *service-defaults
    build: { context: ., dockerfile: services/evaluation/Dockerfile }
    environment:
      <<: *common-env
      RETRIEVAL_URL: http://retrieval:8002
      ADVISOR_URL: http://advisor:8003
      GOLDEN_SET_PATH: /app/data/eval/golden_qa.jsonl
    volumes:
      - ./data/eval:/app/data/eval:ro
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      advisor: { condition: service_healthy }

volumes:
  qdrant_storage:
