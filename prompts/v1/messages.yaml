  roman_ur: "Abhi koi matching course nahi mila."

plan_over_budget:
  en: "Above your budget: {courses}. Instalments are available on most courses; ask an advisor about {cheapest}."
  roman_ur: "Aap ke budget se zyada: {courses}. Zyada tar courses par instalments hain; {cheapest} ke baare mein advisor se poochein."

